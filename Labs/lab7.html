<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7</title>

    <style>
        #imageResults {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 1200px;
            margin: 20px auto;
        }

        #imageResults img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Unsplash API</h1>

    <header>
        <input type="text" id="inputBox"
               placeholder="Search for photos">

        <button onclick="searchUsingXHR()">
            Search using XHR
        </button>

        <button onclick="searchUsingFetch()">
            Search using fetch (promises)
        </button>

        <button onclick="searchUsingFetchAwaitAsync()">
            Search using fetch (async/await)
        </button>
    </header>

    <div id="imageResults"></div>

    <script>
        var accessKey = "";

        // Ask for the API Key 
        function getAccessKey() {
            if (accessKey === "") {
                accessKey = prompt("Enter your Unsplash Access Key:");

                if (accessKey === null || accessKey.trim() === "") {
                    accessKey = "";
                    return false;
                }

                accessKey = accessKey.trim();
            }

            return true;
        }

        // Search using XMLHttpRequest
        function searchUsingXHR() {
            if (!getAccessKey()) {
                return;
            }

            var searchQuery = document.getElementById("inputBox").value;
            var imageResults = document.getElementById("imageResults");

            var xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    var responseObj = JSON.parse(xhr.responseText);

                    imageResults.innerHTML = "";

                    responseObj.results.forEach(function(photo) {
                        var img = document.createElement("img");
                        img.src = photo.urls.small;
                        img.alt = photo.alt_description || searchQuery;
                        img.width = 250;

                        imageResults.appendChild(img);
                    });
                }
            };

            xhr.open(
                "GET",
                "https://api.unsplash.com/search/photos?query=" +
                encodeURIComponent(searchQuery),
                true
            );

            xhr.setRequestHeader(
                "Authorization",
                "Client-ID " + accessKey
            );

            xhr.send();
        }

        // Search using Fetch with Promises
        function searchUsingFetch() {
            if (!getAccessKey()) {
                return;
            }

            var searchQuery = document.getElementById("inputBox").value;
            var imageResults = document.getElementById("imageResults");

            fetch(
                "https://api.unsplash.com/search/photos?query=" +
                encodeURIComponent(searchQuery),
                {
                    headers: {
                        "Authorization": "Client-ID " + accessKey
                    }
                }
            )
            .then(function(response) {
                return response.json();
            })
            .then(function(responseObj) {
                imageResults.innerHTML = "";

                responseObj.results.forEach(function(photo) {
                    var img = document.createElement("img");
                    img.src = photo.urls.small;
                    img.alt = photo.alt_description || searchQuery;
                    img.width = 250;

                    imageResults.appendChild(img);
                });
            });
        }

        // Search using Fetch with Async/Await
        async function searchUsingFetchAwaitAsync() {
            if (!getAccessKey()) {
                return;
            }

            var searchQuery = document.getElementById("inputBox").value;
            var imageResults = document.getElementById("imageResults");

            var response = await fetch(
                "https://api.unsplash.com/search/photos?query=" +
                encodeURIComponent(searchQuery),
                {
                    headers: {
                        "Authorization": "Client-ID " + accessKey
                    }
                }
            );

            var responseObj = await response.json();

            imageResults.innerHTML = "";

            responseObj.results.forEach(function(photo) {
                var img = document.createElement("img");
                img.src = photo.urls.small;
                img.alt = photo.alt_description || searchQuery;
                img.width = 250;

                imageResults.appendChild(img);
            });
        }

    </script>

</body>
</html>
